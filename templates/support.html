<!-- ===== FILE: support.html ===== -->
<!-- Section headings added for readability. -->

<!DOCTYPE html>
<html lang="en">
<!-- ========================= -->
<!-- Document head -->
<!-- ========================= -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive – Support</title>
    <link rel="stylesheet" href="static/css/base.css" />
    <link rel="stylesheet" href="static/css/header.css"/>
    <link rel="stylesheet" href="static/css/modals.css"/>
    <link rel="stylesheet" href="static/css/support.css"/>
    <link rel="stylesheet" href="static/css/responsive.css"/>
    <link rel="stylesheet" href="static/css/profile.css"/>

</head>
<!-- ========================= -->
<!-- Document body -->
<!-- ========================= -->
<body>
<div class="page-wrap">
<!-- ========================= -->
<!-- Header / navigation -->
<!-- ========================= -->
    <header class="main-header">
        <!-- LEFT: Logo -->
        <div class="logo-area">
            <div class="logo-icon"></div>
            <span class="logo-text">Study<span>Hive</span></span>
        </div>
        <!-- CENTER: Nav -->
        <nav class="main-nav">
            <a href="{{ url_for('home') }}" class="nav-pill active">Home</a>
            <a href="{{ url_for('explore') }}" class="nav-pill">Explore</a>
            <a href="{{ url_for('explore') }}" class="nav-pill-plus">+</a>
            <a href="{{ url_for('about') }}" class="nav-pill">About Us</a>
            <a href="{{ url_for('messages') }}" class="nav-pill">Messages</a>
        </nav>
        <!-- RIGHT: Search + Profile -->
        <div class="header-actions">
            <!-- PROFILE -->
            <div class="profile-area" id="profileArea">
                <span class="profile-name">{{ user_name }}</span>
                <img
                    src="{{ nav_profile_image or url_for('static', filename='assets/profile.png') }}"
                    class="profile-icon"
                />

                <div class="profile-menu" id="profileMenu">
                    <a href="{{ url_for('profile') }}">View Profile</a>
                    <a href="#" id="toggleTheme">Toggle Light</a>
                    <a href="{{ url_for('support_page') }}">Support</a>
                    <a href="#" onclick="showSignOut()">Sign Out</a>
                </div>
            </div>
            <!-- SIGN OUT MODAL SHOULD BE OUTSIDE -->
            <div class="modal-overlay" id="signOutModal">
                <div class="modal-box">
                    <h2>Sign Out</h2>
                    <p>Are you sure you wish to sign out?<br>
                    You will need to login again if you wish to proceed.</p>
                    <button href="index.html" class="signout-btn" onclick="signOut()">Sign Out</button>
                </div>
            </div>
        </div>
    </header>
    <!-- SEARCH -->
    <div class="search-section">
        <form class="search-bar" action="/explore" method="GET">
            <input type="text" name="studyhive_search" id="searchInput" placeholder="Search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button class="search-icon" type="submit">
                <img src="{{ url_for('static', filename='assets/icons/bookmark.png') }}" class="search-img">
            </button>
        </form>
    </div>
<!-- ========================= -->
<!-- Main content -->
<!-- ========================= -->
    <main class="main-content support-page">

        <div class="support-box">
        <h2 class="support-title">Support</h2>

        <form id="supportForm">
            <input type="email" id="email" class="support-input" placeholder="Enter email address" required>
            <input type="text" id="name" class="support-input" placeholder="Enter Name" required>
            <textarea id="message" class="support-textarea" placeholder="Enter your message" required></textarea>

            <button type="submit" class="support-submit" id="submitBtn">
                Submit
            </button>

            <div id="loadingSpinner" class="spinner hidden"></div>
        </form>

        <div id="toast" class="toast hidden">
            ✔ Your report has been sent successfully
        </div>
    </div>

    </main>
</div>
<!-- ========================= -->
<!-- Scripts -->
<!-- ========================= -->

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
