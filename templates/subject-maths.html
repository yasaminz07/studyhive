<!-- Section headings added for readability. -->

<!DOCTYPE html>
<html lang="en">
<!-- ========================= -->
<!-- Document head -->
<!-- ========================= -->
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHive – Mathematics</title>
    <link rel="stylesheet" href="static/css/base.css" />
    <link rel="stylesheet" href="static/css/header.css">
    <link rel="stylesheet" href="static/css/modals.css">
    <link rel="stylesheet" href="static/css/home.css">
    <link rel="stylesheet" href="static/css/responsive.css">
</head>
<!-- ========================= -->
<!-- Document body -->
<!-- ========================= -->
<body>
<div class="page-wrap">
<!-- ========================= -->
<!-- Header / navigation -->
<!-- ========================= -->
    <header class="main-header">
        <div class="logo-area">
            <div class="logo-icon"></div>
            <span class="logo-text">Study<span>Hive</span></span>
        </div>

        <nav class="main-nav">
            <a href="{{ url_for('home') }}" class="nav-pill active">Home</a>
            <a href="{{ url_for('explore') }}" class="nav-pill">Explore</a>
            <a href="{{ url_for('explore') }}" class="nav-pill-plus">+</a>
            <a href="{{ url_for('about') }}" class="nav-pill">About Us</a>
            <a href="{{ url_for('messages') }}" class="nav-pill">Messages</a>
        </nav>

        <div class="header-right">
            <div class="search-wrapper">
                <input type="text" placeholder="Search" />
                <button class="icon-btn">🔍</button>
            </div>
            <div class="profile-area">
            <span class="profile-name">{{ user_name }}</span>
            <img
                src="{{ nav_profile_image or url_for('static', filename='assets/profile.png') }}"
                class="profile-icon"
            />

            <!-- DROPDOWN MENU -->
            <div class="profile-menu" id="profileMenu">
                <a href="profile.html">View Profile</a>
                <a href="#" id="toggleTheme">Toggle Light</a>
                <a href="support.html">Support</a>
                <a href="#" onclick="showSignOut()">Sign Out</a>
            </div>

            <!-- SIGN OUT MODAL SHOULD BE OUTSIDE -->
            <div class="modal-overlay" id="signOutModal">
                <div class="modal-box">
                    <h2>Sign Out</h2>
                    <p>Are you sure you wish to sign out?<br>
                    You will need to login again if you wish to proceed.</p>
                    <button href="index.html" class="signout-btn" onclick="signOut()">Sign Out</button>
                </div>
            </div>

        </div>

        </div>
    </header>
<!-- ========================= -->
<!-- Main content -->
<!-- ========================= -->

    <main class="main-content">
        <div class="subject-header-bar">
            <h2 class="page-title">Mathematics</h2>
            <a href="explore.html" class="secondary-btn">BACK</a>
        </div>

        <section class="profile-body-layout">
            <div class="section-row">
                <div class="section-heading">
                    <h3>Tutors</h3>
                    <button class="link-btn">View all</button>
                </div>
                <div class="friends-strip">
                    <div class="avatar-circle purple">U</div>
                    <div class="avatar-circle purple">U</div>
                    <div class="avatar-circle purple">U</div>
                    <div class="avatar-circle purple">U</div>
                    <div class="avatar-circle purple">U</div>
                </div>
            </div>

            <div class="section-row">
                <div class="section-heading">
                    <h3>Maths related posts:</h3>
                </div>

                <article class="post-card">
                    <header class="post-header">
                        <div class="post-author">
                            <div class="avatar-circle purple">U</div>
                            <div>
                                <span class="author-name">USERNAME</span>
                                <span class="post-meta">1 hour ago</span>
                            </div>
                        </div>
                    </header>
                    <div class="post-body">
                        <h3>HELP ME</h3>
                        <p class="post-placeholder"></p>
                    </div>
<!-- ========================= -->
<!-- Footer -->
<!-- ========================= -->
                    <footer class="post-footer">
                        <button class="post-stat">♡ 23.6k Likes</button>
                        <button class="post-stat">💬 2350 Comments</button>
                        <button class="post-stat">🔖 21.8k Saved</button>
                        <button class="post-stat">⤴ Share</button>
                        <button class="post-stat info">ⓘ</button>
                    </footer>
                </article>
            </div>
        </section>
    </main>
</div>
<!-- ========================= -->
<!-- Scripts -->
<!-- ========================= -->

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
